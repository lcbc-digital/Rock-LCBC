name: Rock Build

on:
  push:
    branches:
      - pre-alpha-release
      - lcbc-develop
      - 'lcbc-core-merge-*'
      - feat/triumph-newVisitor-update
      - chore/remove-newVisitor
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Git CRLF
        run: git config --global core.autocrlf true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.USERPROFILE }}\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.sln', '**/packages.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: NuGet Restore
        run: nuget restore Rock.sln

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          # Locate devenv with vswhere instead of hardcoding its path. GitHub periodically moves
          # windows-latest to a new Visual Studio release, which changes the install directory.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $devenv = & $vswhere -latest -products * -find "Common7\IDE\devenv.com" | Select-Object -First 1
          if (-not $devenv) {
            Write-Error "devenv.com not found by vswhere. Check which Visual Studio the runner image includes."
            exit 1
          }
          Write-Host "Building with $devenv"
          & $devenv Rock.sln /build Release

      - name: Upload RockWeb artifact
        uses: actions/upload-artifact@v4
        with:
          name: RockWeb-${{ github.run_number }}
          path: RockWeb/
          retention-days: 30
      
      - name: Slack Notification
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: |
              *Rock Build*: `${{ job.status }}`
              *Branch*: `${{ github.ref_name }}`
              *Commit*: `${{ github.sha }}`
              *Author*: `${{ github.actor }}`
              <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>